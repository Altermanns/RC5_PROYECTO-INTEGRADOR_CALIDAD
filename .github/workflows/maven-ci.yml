name: Java CI/CD Pipeline con Control de Calidad

# 1. Manejo de Ramas y Versionamiento
on:
  push:
    branches: [ "main", "develop" ]
    tags: 
      - "v*.*.*" # Dispara el pipeline al crear un tag de versión (ej. v1.0.0)
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Job de Integración Continua (CI)
  build-and-test:
    name: Build & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Actualizado a JDK 21 para coincidir con tu pom.xml
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Al ejecutar "verify", Maven compila, corre tests (Surefire), 
      # valida Checkstyle, y ejecuta JaCoCo, PMD y SpotBugs automáticamente.
      - name: Build and Verify Quality
        run: mvn clean verify

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/site/jacoco/
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml

  # Job de Despliegue/Release (CD) - Solo se ejecuta si pasa el CI y es en 'main'
  release:
    name: Create GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Solo se ejecuta al subir un tag de versión

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Final JAR
        run: mvn clean package -DskipTests # Se saltan las pruebas porque ya pasaron en el job anterior

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/gestion-tareas-1.0-SNAPSHOT.jar # Asegura que este nombre coincida con el generado
          generate_release_notes: true
